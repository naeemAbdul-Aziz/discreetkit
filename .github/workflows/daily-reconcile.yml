name: Daily Payments Reconcile

on:
  schedule:
    # Runs daily at 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reconcile-payments:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-reconcile
      cancel-in-progress: false
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "❌ SITE_URL secret is missing"; exit 1;
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ CRON_SECRET secret is missing"; exit 1;
          fi

      - name: Ensure curl is installed
        shell: bash
        run: |
          if ! command -v curl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y curl
          fi
          curl --version

      - name: Reconcile Payments
        shell: bash
        run: |
          for i in 1 2 3; do
            curl --silent --show-error --fail --max-time 60 -L \
              -X GET "$SITE_URL/api/payments/reconcile" \
              -H "x-cron-key: $CRON_SECRET" && exit 0 || echo "Retry $i/3 in 10s";
            sleep 10;
          done
          echo "❌ Reconcile Payments failed after retries"; exit 1
