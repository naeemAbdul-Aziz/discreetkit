name: Cron Jobs

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-crons:
    runs-on: ubuntu-latest
    steps:
      - name: Check Escalations (Every 15m)
        run: |
          curl -X GET ${{ secrets.SITE_URL }}/api/cron/check-escalations -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" --fail

      - name: Release Reservations (Every 15m)
        run: |
          curl -X GET ${{ secrets.SITE_URL }}/api/cron/release-reservations -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" --fail

      - name: Reconcile Payments (Daily at 5 AM UTC)
        run: |
          curl -X GET ${{ secrets.SITE_URL }}/api/payments/reconcile -H "x-cron-key: ${{ secrets.CRON_SECRET }}" --fail
