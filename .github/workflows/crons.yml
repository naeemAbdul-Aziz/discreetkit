name: Cron Jobs

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-crons:
    runs-on: ubuntu-latest
    concurrency:
      group: cron-15m
      cancel-in-progress: false
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "❌ SITE_URL secret is missing"; exit 1;
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ CRON_SECRET secret is missing"; exit 1;
          fi

      - name: Ensure curl is installed
        shell: bash
        run: |
          if ! command -v curl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y curl
          fi
          curl --version

      - name: Check Escalations (Every 15m)
        shell: bash
        run: |
          for i in 1 2 3; do
            curl --silent --show-error --fail --max-time 60 -L \
              -X GET "$SITE_URL/api/cron/check-escalations" \
              -H "Authorization: Bearer $CRON_SECRET" && exit 0 || echo "Retry $i/3 in 10s";
            sleep 10;
          done
          echo "❌ Check Escalations failed after retries"; exit 1

      - name: Release Reservations (Every 15m)
        shell: bash
        run: |
          for i in 1 2 3; do
            curl --silent --show-error --fail --max-time 60 -L \
              -X GET "$SITE_URL/api/cron/release-reservations" \
              -H "Authorization: Bearer $CRON_SECRET" && exit 0 || echo "Retry $i/3 in 10s";
            sleep 10;
          done
          echo "❌ Release Reservations failed after retries"; exit 1
